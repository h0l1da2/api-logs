<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API 호출 기록</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6eb; --text: #1d2330; --muted: #6b7280;
    --accent: #2563eb; --ok: #16a34a; --warn: #d97706; --err: #dc2626; --chip: #eef1f5;
    --code-bg: #f3f5f8; --shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1e26; --line: #2a303b; --text: #e6e8ec; --muted: #9aa3b2;
      --accent: #60a5fa; --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --chip: #232934;
      --code-bg: #141820; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
           padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { margin: 0; font-size: 18px; }
  header .meta { color: var(--muted); font-size: 12px; }
  main { padding: 20px 24px 48px; max-width: 1400px; margin: 0 auto; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); color: var(--text); padding: 6px 12px; cursor: pointer; font: inherit; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.active { background: var(--accent); color: #fff; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); }
  .card.click { cursor: pointer; }
  .card.click:hover { border-color: var(--accent); }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .card .value.ok { color: var(--ok); } .card .value.warn { color: var(--warn); } .card .value.err { color: var(--err); }
  .grid2 { display: grid; grid-template-columns: 3fr 2fr; gap: 12px; margin-bottom: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; box-shadow: var(--shadow); min-width: 0; }
  .panel h2 { margin: 0 0 10px; font-size: 14px; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  svg text { fill: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .filters input, .filters select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
           padding: 6px 10px; font: inherit; min-width: 0; }
  .filters input.w-path { width: 200px; } .filters input.w-mid { width: 150px; } .filters input.w-sm { width: 110px; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--panel); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--chip); }
  td.path { max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
  td.err-col { max-width: 320px; overflow: hidden; text-overflow: ellipsis; color: var(--err); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .badge { display: inline-block; min-width: 40px; text-align: center; padding: 1px 6px; border-radius: 999px; font-weight: 600; font-size: 12px; }
  .s2 { background: rgba(22,163,74,.12); color: var(--ok); } .s3 { background: var(--chip); color: var(--muted); }
  .s4 { background: rgba(217,119,6,.14); color: var(--warn); } .s5 { background: rgba(220,38,38,.14); color: var(--err); }
  .chip { display: inline-block; background: var(--chip); color: var(--muted); border-radius: 6px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
  .slow { color: var(--warn); font-weight: 600; }
  .more { text-align: center; padding: 12px; color: var(--muted); }
  .error-box { background: rgba(220,38,38,.08); color: var(--err); border: 1px solid rgba(220,38,38,.3); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; display: none; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(1100px, 96vw); max-height: 90vh;
           background: var(--panel); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .dlg-head h3 { margin: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dlg-body { padding: 14px 18px; overflow: auto; max-height: calc(90vh - 60px); }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; font-size: 13px; margin-bottom: 14px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-all; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .tabs button { border: 0; background: none; color: var(--muted); padding: 8px 12px; cursor: pointer; font: inherit; border-bottom: 2px solid transparent; }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  .tools { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 6px; align-items: center; }
  .note { color: var(--warn); font-size: 12px; margin-right: auto; }
  pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0;
        white-space: pre-wrap; word-break: break-all; max-height: 55vh; overflow: auto; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
           padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div>
    <h1>API 호출 기록</h1>
    <div class="meta">요청·응답 본문은 마스킹 후 저장(1건당 최대 1MB) · 최근 2일 보관</div>
  </div>
  <div class="seg" id="period">
    <button data-hours="1">1시간</button>
    <button data-hours="6">6시간</button>
    <button data-hours="24" class="active">24시간</button>
    <button data-hours="48">48시간</button>
  </div>
</header>

<main>
  <div class="error-box" id="error"></div>

  <section class="cards" id="cards"></section>

  <section class="grid2">
    <div class="panel">
      <h2>시간대별 호출</h2>
      <div class="legend"><span><i style="background:var(--ok)"></i>성공</span><span><i style="background:var(--err)"></i>에러(4xx·5xx)</span></div>
      <div id="chart-hour"></div>
    </div>
    <div class="panel">
      <h2>route별 호출 상위 10</h2>
      <div class="legend"><span><i style="background:var(--accent)"></i>호출</span><span><i style="background:var(--err)"></i>에러</span></div>
      <div id="chart-route"></div>
    </div>
  </section>

  <section class="panel">
    <form class="filters" id="filters" autocomplete="off">
      <select name="status">
        <option value="">상태 전체</option>
        <option value="2xx">2xx</option>
        <option value="4xx,5xx">에러(4xx·5xx)</option>
        <option value="4xx">4xx</option>
        <option value="5xx">5xx</option>
      </select>
      <select name="method">
        <option value="">method 전체</option>
        <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option>
      </select>
      <input name="path" class="w-path" placeholder="경로 (부분 일치)">
      <input name="requestId" class="w-mid mono" placeholder="requestId">
      <input name="caller" class="w-mid" placeholder="caller (user:1)">
      <input name="minElapsedMs" class="w-sm" type="number" min="0" placeholder="최소 ms">
      <input name="q" class="w-path" placeholder="본문·에러 검색">
      <button class="btn primary" type="submit">조회</button>
      <button class="btn" type="button" id="reset">리셋</button>
    </form>
    <div class="table-wrap">
      <table>
        <thead><tr><th>시각</th><th>상태</th><th>method</th><th>경로</th><th>응답</th><th>caller</th><th>requestId</th><th>에러</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="more" id="more"></div>
  </section>
</main>

<dialog id="detail">
  <div class="dlg-head">
    <h3 id="detail-title"></h3>
    <button class="btn" id="detail-close" type="button">닫기</button>
  </div>
  <div class="dlg-body" id="detail-body"></div>
</dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  const BASE = location.pathname.replace(/\/(index\.html)?$/, '');
  const API = BASE + '/api';
  const SLOW_MS = 1000;
  const FILTER_KEYS = ['status', 'method', 'path', 'requestId', 'caller', 'minElapsedMs', 'q'];

  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const num = (v) => Number(v || 0).toLocaleString('ko-KR');

  const state = { hours: 24, cursor: null, loading: false, done: false, gen: 0 };

  // ── 공통 ──
  async function getJson(url) {
    const res = await fetch(url, { headers: { Accept: 'application/json' } });
    if (!res.ok) {
      let message = res.status + ' ' + res.statusText;
      try { message = (await res.json()).message || message; } catch (e) { /* 본문 없음 */ }
      throw new Error(message);
    }
    return res.json();
  }

  function showError(message) {
    const box = $('error');
    box.textContent = message ? '불러오지 못했습니다: ' + message : '';
    box.style.display = message ? 'block' : 'none';
  }

  function toast(message) {
    const el = $('toast');
    el.textContent = message;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1500);
  }

  function localIso(date) {
    const p = (n) => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}T${p(date.getHours())}:${p(date.getMinutes())}`;
  }

  function periodParams() {
    const to = new Date();
    const from = new Date(to.getTime() - state.hours * 3600 * 1000);
    return { from: localIso(from), to: localIso(new Date(to.getTime() + 60 * 1000)) };
  }

  function fmtTime(ts) {
    if (!ts) return '-';
    return ts.replace('T', ' ').replace(/\.\d+/, '').replace(/\+\d\d:\d\d$/, '');
  }

  function badge(status) {
    const cls = 's' + String(status)[0];
    return `<span class="badge ${esc(cls)}">${esc(status)}</span>`;
  }

  // ── URL 해시 ↔ 필터 ──
  function readHash() {
    const params = new URLSearchParams(location.hash.slice(1));
    const form = $('filters');
    FILTER_KEYS.forEach((key) => { form.elements[key].value = params.get(key) || ''; });
    const hours = Number(params.get('hours'));
    if ([1, 6, 24, 48].includes(hours)) state.hours = hours;
    document.querySelectorAll('#period button').forEach((b) => b.classList.toggle('active', Number(b.dataset.hours) === state.hours));
  }

  function writeHash() {
    const params = new URLSearchParams();
    FILTER_KEYS.forEach((key) => { const v = $('filters').elements[key].value.trim(); if (v) params.set(key, v); });
    if (state.hours !== 24) params.set('hours', state.hours);
    history.replaceState(null, '', params.toString() ? '#' + params.toString() : location.pathname);
  }

  // ── 요약 카드 + 차트 ──
  async function loadSummary() {
    const s = await getJson(API + '/summary?' + new URLSearchParams(periodParams()));
    const errRate = s.total ? Math.round(((s.clientErr + s.serverErr) / s.total) * 1000) / 10 : 0;
    $('cards').innerHTML = [
      card('전체 호출', num(s.total), '', ''),
      card('성공 (2xx·3xx)', num(s.ok), 'ok', '2xx'),
      card('4xx', num(s.clientErr), 'warn', '4xx'),
      card('5xx', num(s.serverErr), 'err', '5xx'),
      card('에러율', errRate + '%', errRate >= 5 ? 'err' : '', '4xx,5xx'),
      card('평균 · p95 응답', `${num(s.avgElapsedMs)} · ${num(s.p95ElapsedMs)}ms`, '', ''),
      card('기록 누락', num(s.dropped), s.dropped ? 'warn' : '', ''),
    ].join('');
    document.querySelectorAll('#cards .card.click').forEach((el) => el.addEventListener('click', () => {
      $('filters').elements.status.value = el.dataset.status;
      search();
    }));
    drawHourChart(s.byHour || []);
    drawRouteChart(s.byRoute || []);
  }

  function card(label, value, tone, status) {
    const click = status ? ` click" data-status="${esc(status)}` : '';
    return `<div class="card${click}"><div class="label">${esc(label)}</div><div class="value ${tone}">${esc(value)}</div></div>`;
  }

  function niceMax(v) {
    if (v <= 5) return 5;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    return Math.ceil(v / p) * p;
  }

  function drawHourChart(rows) {
    const el = $('chart-hour');
    if (!rows.length) { el.innerHTML = '<div class="empty">기간 안에 기록이 없습니다</div>'; return; }
    const W = 640, H = 220, L = 40, R = 8, T = 10, B = 26;
    const max = niceMax(Math.max(...rows.map((r) => r.ok + r.err)));
    const step = (W - L - R) / rows.length;
    const bw = Math.max(2, Math.min(28, step * 0.7));
    const y = (v) => T + (H - T - B) * (1 - v / max);
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="시간대별 호출">`;
    for (let i = 0; i <= 4; i++) {
      const v = (max / 4) * i, yy = y(v);
      svg += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${num(Math.round(v))}</text>`;
    }
    const labelEvery = Math.ceil(rows.length / 8);
    rows.forEach((r, i) => {
      const x = L + step * i + (step - bw) / 2;
      const okTop = y(r.ok), errTop = y(r.ok + r.err);
      svg += `<g><title>${esc(r.hour.replace('T', ' '))}  성공 ${r.ok} · 에러 ${r.err}</title>`;
      svg += `<rect x="${x}" y="${okTop}" width="${bw}" height="${y(0) - okTop}" fill="var(--ok)" opacity=".85"/>`;
      if (r.err) svg += `<rect x="${x}" y="${errTop}" width="${bw}" height="${okTop - errTop}" fill="var(--err)"/>`;
      svg += '</g>';
      if (i % labelEvery === 0) svg += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(r.hour.slice(11, 13))}시</text>`;
    });
    el.innerHTML = svg + '</svg>';
  }

  function drawRouteChart(rows) {
    const el = $('chart-route');
    if (!rows.length) { el.innerHTML = '<div class="empty">기간 안에 기록이 없습니다</div>'; return; }
    const W = 460, rowH = 22, labelW = 200, R = 44;
    const H = rows.length * rowH + 8;
    const max = Math.max(...rows.map((r) => r.count));
    const x = (v) => (W - labelW - R) * (v / max);
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="route별 호출">`;
    rows.forEach((r, i) => {
      const yy = 4 + i * rowH;
      const label = r.route.length > 30 ? '…' + r.route.slice(-29) : r.route;
      svg += `<g style="cursor:pointer" data-route="${esc(r.route)}"><title>${esc(r.route)}  호출 ${r.count} · 에러 ${r.errors}</title>`;
      svg += `<text x="${labelW - 6}" y="${yy + 14}" text-anchor="end">${esc(label)}</text>`;
      svg += `<rect x="${labelW}" y="${yy + 3}" width="${Math.max(1, x(r.count))}" height="${rowH - 8}" fill="var(--accent)" opacity=".75" rx="2"/>`;
      if (r.errors) svg += `<rect x="${labelW}" y="${yy + 3}" width="${Math.max(1, x(r.errors))}" height="${rowH - 8}" fill="var(--err)" rx="2"/>`;
      svg += `<text x="${labelW + x(r.count) + 4}" y="${yy + 14}">${num(r.count)}</text></g>`;
    });
    el.innerHTML = svg + '</svg>';
    el.querySelectorAll('g[data-route]').forEach((g) => g.addEventListener('click', () => {
      $('filters').elements.path.value = g.dataset.route.replace(/\{[^}]+\}.*$/, '');
      search();
    }));
  }

  // ── 목록 ──
  function listParams() {
    const params = new URLSearchParams(periodParams());
    FILTER_KEYS.forEach((key) => { const v = $('filters').elements[key].value.trim(); if (v) params.set(key, v); });
    params.set('size', '50');
    if (state.cursor) params.set('cursor', state.cursor);
    return params;
  }

  async function loadMore() {
    if (state.loading || state.done) return;
    const gen = state.gen;
    state.loading = true;
    $('more').textContent = '불러오는 중…';
    try {
      const page = await getJson(API + '/logs?' + listParams());
      if (gen !== state.gen) return; // 조회 조건이 바뀐 뒤 도착한 응답은 버린다
      $('rows').insertAdjacentHTML('beforeend', page.items.map(row).join(''));
      state.cursor = page.nextCursor;
      state.done = !page.nextCursor;
      const count = $('rows').children.length;
      $('more').textContent = count === 0 ? '조건에 맞는 기록이 없습니다' : (state.done ? `${num(count)}건 (끝)` : `${num(count)}건 · 스크롤하면 더 불러옵니다`);
      showError('');
    } catch (e) {
      $('more').textContent = '';
      showError(e.message);
    } finally {
      if (gen === state.gen) state.loading = false;
    }
  }

  function row(item) {
    const slow = item.elapsedMs >= SLOW_MS ? ' class="slow"' : '';
    const chips = (item.skipReason ? `<span class="chip">${esc(item.skipReason)}</span>` : '')
      + (item.truncated ? '<span class="chip">잘림</span>' : '');
    return `<tr data-id="${esc(item.id)}">
      <td class="mono">${esc(fmtTime(item.ts))}</td>
      <td>${badge(item.status)}</td>
      <td class="mono">${esc(item.method)}</td>
      <td class="path mono" title="${esc(item.path)}">${esc(item.path)}${chips}</td>
      <td${slow}>${num(item.elapsedMs)}ms</td>
      <td>${esc(item.caller)}</td>
      <td class="mono">${esc(item.requestId || '-')}</td>
      <td class="err-col" title="${esc(item.error || '')}">${esc(item.error || '')}</td>
    </tr>`;
  }

  function search() {
    writeHash();
    state.gen++;
    state.loading = false;
    state.cursor = null;
    state.done = false;
    $('rows').innerHTML = '';
    loadSummary().catch((e) => showError(e.message));
    loadMore();
  }

  // ── 상세 ──
  async function openDetail(id) {
    try {
      const r = await getJson(API + '/logs/' + encodeURIComponent(id));
      $('detail-title').innerHTML = `${badge(r.status)} <span class="mono">${esc(r.method)} ${esc(r.path)}</span>`;
      $('detail-body').innerHTML = detailHtml(r);
      bindDetail(r);
      $('detail').showModal();
    } catch (e) {
      showError(e.message);
    }
  }

  function detailHtml(r) {
    const kv = (k, v) => `<dt>${esc(k)}</dt><dd>${v}</dd>`;
    return `<dl class="kv">
        ${kv('시각', esc(fmtTime(r.ts)))}
        ${kv('응답 시간', esc(num(r.elapsedMs) + 'ms'))}
        ${kv('route', `<span class="mono">${esc(r.route || '-')}</span>`)}
        ${kv('쿼리', `<span class="mono">${esc(r.query || '-')}</span>`)}
        ${kv('caller', esc(r.caller))}
        ${kv('client IP', esc(r.clientIp || '-'))}
        ${kv('requestId', `<span class="mono">${esc(r.requestId || '-')}</span>`)}
        ${kv('기록 id', `<span class="mono">${esc(r.id)}</span>`)}
        ${r.skipReason ? kv('본문 제외', esc(r.skipReason)) : ''}
        ${r.error ? kv('에러', `<span class="mono" style="color:var(--err)">${esc(r.error)}</span>`) : ''}
      </dl>
      <div class="tabs">
        <button type="button" class="active" data-tab="res">응답</button>
        <button type="button" data-tab="req">요청</button>
        ${r.reqHeaders || r.resHeaders ? '<button type="button" data-tab="headers">헤더</button>' : ''}
      </div>
      <div class="tools">
        <span class="note" id="trunc-note"></span>
        <button class="btn" type="button" id="toggle-raw">원문 보기</button>
        <button class="btn" type="button" id="copy-body">본문 복사</button>
        <button class="btn" type="button" id="copy-curl">curl로 복사</button>
      </div>
      <pre class="mono" id="body-view"></pre>`;
  }

  function pretty(text, raw) {
    if (text == null || text === '') return '(본문 없음)';
    if (raw) return text;
    try { return JSON.stringify(JSON.parse(text), null, 2); } catch (e) { return text; }
  }

  function bindDetail(r) {
    let tab = 'res';
    let raw = false;
    const render = () => {
      const body = tab === 'req' ? r.reqBody : tab === 'res' ? r.resBody : null;
      const bytes = tab === 'req' ? r.reqBodyBytes : r.resBodyBytes;
      $('body-view').textContent = tab === 'headers'
        ? JSON.stringify({ request: r.reqHeaders, response: r.resHeaders }, null, 2)
        : pretty(body, raw);
      const truncated = r.truncated && body && bytes && bytes > new TextEncoder().encode(body).length;
      $('trunc-note').textContent = truncated ? `앞부분만 저장됨 (원래 ${num(bytes)} bytes)` : '';
      $('toggle-raw').textContent = raw ? '정렬해서 보기' : '원문 보기';
    };
    document.querySelectorAll('#detail .tabs button').forEach((b) => b.addEventListener('click', () => {
      document.querySelectorAll('#detail .tabs button').forEach((x) => x.classList.toggle('active', x === b));
      tab = b.dataset.tab;
      render();
    }));
    $('toggle-raw').addEventListener('click', () => { raw = !raw; render(); });
    $('copy-body').addEventListener('click', () => copy($('body-view').textContent, '본문을 복사했습니다'));
    $('copy-curl').addEventListener('click', () => copy(curlOf(r), 'curl 명령을 복사했습니다 (가려진 값은 *** 그대로)'));
    render();
  }

  function curlOf(r) {
    const quote = (s) => "'" + String(s).replace(/'/g, "'\\''") + "'";
    const url = location.origin + r.path + (r.query ? '?' + r.query : '');
    let cmd = `curl -X ${r.method} ${quote(url)}`;
    if (r.reqContentType) cmd += ` \\\n  -H ${quote('Content-Type: ' + r.reqContentType)}`;
    cmd += ` \\\n  -H ${quote('Authorization: Bearer <토큰>')}`;
    if (r.reqBody && !r.reqBody.startsWith('[multipart]')) cmd += ` \\\n  --data-raw ${quote(r.reqBody)}`;
    return cmd;
  }

  async function copy(text, message) {
    try {
      await navigator.clipboard.writeText(text);
      toast(message);
    } catch (e) {
      toast('복사하지 못했습니다');
    }
  }

  // ── 이벤트 ──
  $('filters').addEventListener('submit', (e) => { e.preventDefault(); search(); });
  $('reset').addEventListener('click', () => { $('filters').reset(); search(); });
  $('period').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    state.hours = Number(b.dataset.hours);
    document.querySelectorAll('#period button').forEach((x) => x.classList.toggle('active', x === b));
    search();
  });
  $('rows').addEventListener('click', (e) => {
    const tr = e.target.closest('tr[data-id]');
    if (tr) openDetail(tr.dataset.id);
  });
  $('detail-close').addEventListener('click', () => $('detail').close());
  $('detail').addEventListener('click', (e) => { if (e.target === $('detail')) $('detail').close(); });
  new IntersectionObserver((entries) => {
    if (entries.some((x) => x.isIntersecting)) loadMore();
  }, { rootMargin: '200px' }).observe($('more'));

  readHash();
  search();
})();
</script>
</body>
</html>
